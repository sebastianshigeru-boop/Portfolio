<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sebastian Higa</title>
<meta name="description" content="Sebastian Higa — industrial engineer, founder, marketing specialist and DJ. Resume, zaizai.ca, automation tools, DJ Zech and marketing.">
<meta name="theme-color" content="#2B0B08">
<meta property="og:title" content="Sebastian Higa">
<meta property="og:description" content="Resume · zaizai.ca · Automation & Engineering Tools · DJ Zech · Marketing">
<meta property="og:image" content="assets/home/sebastian.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#1A0705;
    --deep:#2B0B08;
    --warm:#8E2416;
    --pill:#F1F6C8;
    --pill-hover:#E4F08A;
    --pill-ink:#3A0F0A;
    --cream:#FFF4E6;
    --radius-card:36px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--page);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 16px;
    position:relative;
    overflow-x:hidden;
  }
  /* blurred photo filling the page behind the card */
  body::before{
    content:""; position:fixed; inset:-40px; z-index:-2;
    background:url("assets/home/sebastian.jpg") center 35% / cover no-repeat;
    filter:blur(28px) saturate(1.2) brightness(0.55);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background:radial-gradient(ellipse at center, rgba(26,7,5,0.15), rgba(26,7,5,0.75));
  }
  a{text-decoration:none; color:inherit;}

  .card{
    width:100%; max-width:430px;
    border-radius:var(--radius-card);
    overflow:hidden;
    position:relative;
    background:var(--deep);
    box-shadow:0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .photo{
    position:relative;
    aspect-ratio:1 / 1;
    background:url("assets/home/sebastian.jpg") center 40% / cover no-repeat;
  }
  .photo::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(142,36,22,0) 45%,
      rgba(142,36,22,0.55) 72%,
      var(--warm) 100%);
  }

  .content{
    position:relative;
    margin-top:-110px;
    padding:0 24px 32px;
    background:linear-gradient(180deg, transparent 0, var(--warm) 110px, var(--deep) 100%);
    display:flex; flex-direction:column; align-items:center;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:clamp(46px, 13vw, 58px);
    line-height:1;
    letter-spacing:0.01em;
    color:var(--cream);
    text-align:center;
    text-shadow:0 2px 18px rgba(0,0,0,0.35);
  }
  .tagline{
    margin:12px 0 28px;
    font-size:13.5px; letter-spacing:0.04em;
    color:rgba(255,244,230,0.78);
    text-align:center; line-height:1.5;
  }

  .links{list-style:none; width:100%; display:flex; flex-direction:column; gap:12px;}
  .link{
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:58px;
    padding:10px 18px 10px 10px;
    border-radius:100px;
    background:var(--pill);
    color:var(--pill-ink);
    font-weight:600; font-size:15.5px;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    transition:transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .link:hover, .link:focus-visible{
    background:var(--pill-hover);
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
  }
  .link:focus-visible{outline:2px solid var(--cream); outline-offset:3px;}
  .link .ico{
    width:38px; height:38px; flex-shrink:0;
    border-radius:50%;
    background:var(--pill-ink); color:var(--pill);
    display:flex; align-items:center; justify-content:center;
  }
  .link .ico svg{width:18px; height:18px;}
  .link .label{flex:1; text-align:center; padding-right:38px; line-height:1.25;}
  .link .label small{display:block; font-weight:500; font-size:12px; opacity:0.65; margin-top:2px;}

  footer{
    margin-top:28px; text-align:center;
    font-size:12px; letter-spacing:0.06em;
    color:rgba(255,244,230,0.55);
  }

  /* phones: card fills the screen like a link-in-bio page */
  @media (max-width:520px){
    body{padding:0; align-items:stretch;}
    .card{max-width:none; border-radius:0; min-height:100vh; box-shadow:none; display:flex; flex-direction:column;}
    .photo{aspect-ratio:3 / 4; background-position:center 30%;}
    .content{flex:1;}
    .content{padding:0 16px calc(28px + env(safe-area-inset-bottom));}
  }
  @media (prefers-reduced-motion:reduce){
    .link{transition:none;}
    .link:hover{transform:none;}
  }

  /* ---- contact menu (top of card) ---- */
  .contact-menu{position:absolute; top:18px; right:18px; z-index:5;}
  .contact-menu summary{
    list-style:none; cursor:pointer; user-select:none;
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:100px;
    background:var(--pill); color:var(--pill-ink);
    font-weight:600; font-size:14px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    transition:background 0.2s ease;
  }
  .contact-menu summary:hover{background:var(--pill-hover);}
  .contact-menu summary::-webkit-details-marker{display:none;}
  .contact-menu summary::after{content:""; width:6px; height:6px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform 0.2s ease;}
  .contact-menu[open] summary::after{transform:translateY(1px) rotate(-135deg);}
  .cm-pop{
    position:absolute; right:0; top:calc(100% + 8px);
    min-width:170px; padding:8px; border-radius:22px;
    background:var(--pill); box-shadow:0 14px 36px rgba(0,0,0,0.35);
    display:flex; flex-direction:column; gap:4px;
  }
  .cm-item{display:flex; align-items:center; gap:10px; padding:8px 12px 8px 8px; border-radius:100px; color:var(--pill-ink); font-weight:600; font-size:14.5px;}
  .cm-item:hover{background:var(--pill-hover);}
  .cm-ico{width:32px; height:32px; border-radius:50%; background:var(--pill-ink); color:var(--pill); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cm-ico svg{width:15px; height:15px;}
</style>
</head>
<body>
<main class="card">
  <details class="contact-menu">
    <summary>Contact</summary>
    <div class="cm-pop">
      <a class="cm-item" data-contact="sms" href="sms:+12369784744"><span class="cm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>Phone</a>
      <a class="cm-item" data-contact="mail" href="mailto:sebastian.shigeru@gmail.com?subject=Hello"><span class="cm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg></span>Email</a>
    </div>
  </details>
  <div class="photo" role="img" aria-label="Sebastian Higa"></div>

  <div class="content">
    <h1>Sebastian Higa</h1>
    <p class="tagline">Industrial Engineer · Founder · Marketing · DJ</p>

    <ul class="links">
      <li>
        <a class="link" href="/resume">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
          <span class="label">Resume</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://zaizai.ca" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <span class="label">zaizai.ca<small>AI resume optimizer</small></span>
        </a>
      </li>
      <li>
        <a class="link" href="/automations">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
          <span class="label">Automation &amp; Engineering Tools</span>
        </a>
      </li>
      <li>
        <a class="link" href="/dj">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
          <span class="label">DJ Zech</span>
        </a>
      </li>
      <li>
        <a class="link" href="/marketing">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8v18L3 13z"/><path d="M7 12v6a2 2 0 0 0 4 0v-4"/></svg></span>
          <span class="label">Marketing</span>
        </a>
      </li>
    </ul>

    <footer>sebastianhiga.com · Vancouver, BC → GTA</footer>
  </div>
</main>
<script>
  // contact menu: prefill messages with the page the visitor came from,
  // and close on outside click or Escape
  (function(){
    var m=document.querySelector('.contact-menu'); if(!m) return;
    var slug=location.pathname.split('/').pop().replace(/\.html$/,'').replace(/^index$/,'');
    var page=(/^https?:$/.test(location.protocol) ? location.origin : 'https://sebastianhiga.com')+'/'+slug;
    var msg='Hello, I come from '+page+'. My name is ';
    var mailMsg='Hello, I come from '+page+'.\nMy name is ';
    m.querySelectorAll('[data-contact]').forEach(function(a){
      var t=a.dataset.contact;
      if(t==='sms') a.href='sms:+12369784744?&body='+encodeURIComponent(msg);
      if(t==='mail') a.href='mailto:sebastian.shigeru@gmail.com?subject=Hello&body='+encodeURIComponent(mailMsg);
      if(t==='ig') a.addEventListener('click',function(){
        // Instagram can't prefill DMs, so copy the message for the visitor to paste
        if(navigator.clipboard) navigator.clipboard.writeText(msg).catch(function(){});
        var n=document.createElement('div');
        n.textContent='Message copied, paste it in the chat';
        n.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;padding:12px 18px;border-radius:100px;font:600 14px Inter,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)';
        document.body.appendChild(n); setTimeout(function(){ n.remove(); },3500);
      });
    });
    document.addEventListener('click',function(e){ if(m.open && !m.contains(e.target)) m.open=false; });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') m.open=false; });
  })();
</script>
</body>
</html>
