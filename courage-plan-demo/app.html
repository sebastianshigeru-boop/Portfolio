<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Courage Plan · Client app</title>
<meta name="description" content="Demo: a personal life organization app for a Courage Space client.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F3ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3ED; --panel:#FFFFFF; --panel-2:#F2EEE6; --line:#E9E3D7; --text:#2B2722; --muted:#7A7264;
  --accent:#EF7A4E; --accent-2:#F2A25C; --accent-soft:#FDECE0; --accent-ink:#B84A22;
  --green:#5FAE6C; --green-ink:#2F7A3D; --red:#E0625F; --red-ink:#B03B38; --amber:#E2A33B; --amber-ink:#8F5F0A;
  --display:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow:0 1px 2px rgba(43,39,34,.04), 0 6px 18px rgba(43,39,34,.06);
  --nav-h:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E9E3D7;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .12s ease, background .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-weight:500}
.muted{color:var(--muted)}

/* demo nav */
.demo-nav{position:sticky;top:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#2B2722;color:#F6F3ED;font-size:13px}
.demo-brand{font-family:var(--display);font-weight:600;white-space:nowrap}
.demo-brand em{font-style:normal;color:#F2A25C;margin-left:4px}
.demo-links{display:flex;gap:4px;overflow-x:auto}
.demo-links a{color:#E9E3D7;text-decoration:none;padding:6px 12px;border-radius:999px;white-space:nowrap;font-weight:500}
.demo-links a:hover{background:rgba(255,255,255,.08)}
.demo-links a[aria-current="page"]{background:#F6F3ED;color:#2B2722}
@media (max-width:560px){.demo-brand{display:none}.demo-nav{justify-content:center}}

/* phone frame */
.stage{display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.phone{position:relative;width:100%;max-width:430px;height:min(900px, calc(100vh - var(--nav-h) - 48px));min-height:620px;background:var(--bg);border:10px solid #2B2722;border-radius:46px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(43,39,34,.25)}
@media (max-width:520px){
  body{background:var(--bg)}
  .stage{padding:0}
  .phone{max-width:none;border:0;border-radius:0;box-shadow:none;height:calc(100vh - var(--nav-h));height:calc(100dvh - var(--nav-h));min-height:0}
}
.app-head{background:linear-gradient(180deg,#FFF8F1 0%,var(--bg) 100%);padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.app-title{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-sub{font-size:12px;color:var(--muted)}
.head-btns{display:flex;gap:6px;flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;text-decoration:none;color:var(--text)}
.pill-btn:hover{background:var(--panel-2)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent-soft)}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.card h3,.sec-title{font-family:var(--display);font-weight:600;font-size:16px}
.sec-title{margin:22px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px}
.level{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;min-height:40px;text-decoration:none}
.btn-primary{background:var(--accent-ink);color:#fff}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-danger{background:#FCE8E7;color:var(--red-ink)}
.btn-sm{padding:6px 12px;min-height:32px;font-size:13px}
.btn-block{width:100%}
.icon-btn{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:70px;line-height:1.45}
.field{margin-top:10px}
.field label,.flabel{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.badge.neutral{background:var(--panel-2);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--panel-2);font-size:13px;font-weight:500;border:1px solid transparent}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.pbar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.pbar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease}
.due{font-size:13px;font-weight:500}
.due.soon{color:var(--amber-ink)}
.due.late{color:var(--red-ink)}

/* today */
.hero{padding:6px 2px 4px}
.hero .hi{font-size:14px;color:var(--muted)}
.hero h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin-top:2px}
.hero p{margin-top:4px;color:var(--muted);font-size:14px}
.phase-card{background:linear-gradient(135deg,var(--accent-soft),#fff 70%)}
.phase-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 10px}
.phase-steps span{height:6px;border-radius:999px;background:var(--line)}
.phase-steps span.on{background:var(--accent)}
.prompt{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3;margin:4px 0 10px}
.saved{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel-2);padding:4px;border-radius:999px;margin-top:10px}
.seg button{padding:8px 4px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent-ink);box-shadow:0 1px 4px rgba(43,39,34,.1)}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .body{flex:1;min-width:0}
.task .t{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.task .s{font-size:12px;color:var(--muted)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid #CFC7B8;background:#fff;flex:none;cursor:pointer;display:grid;place-content:center;transition:all .15s}
.check:checked{background:var(--accent-ink);border-color:var(--accent-ink)}
.check:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hrs{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .card{margin-top:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-wrap{position:relative;width:104px;height:104px}
.ring-wrap .v{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--mono);font-size:20px}
.big-num{font-family:var(--mono);font-size:34px;line-height:1;color:var(--accent-ink)}
.small{font-size:12px;color:var(--muted)}

/* goals */
.vision{background:linear-gradient(135deg,#fff,var(--accent-soft))}
.vision blockquote{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.35;margin-top:6px}
.load-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.cap input{width:60px;padding:6px 8px;text-align:center}
.obj{border-left:5px solid var(--area);padding-left:14px}
.obj-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.area-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text)}
.area-tag i{width:9px;height:9px;border-radius:50%;background:var(--area);display:block}
.obj h4{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3;margin:8px 0}
.obj-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:8px;font-size:13px}
.obj-meta .pct{font-family:var(--mono);font-size:13px}
.obj-actions{display:flex;gap:2px}
.sub-h{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.linkish{color:var(--accent-ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.inline-form{background:var(--panel-2);border-radius:14px;padding:12px;margin-top:10px}
.inline-form .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.path{list-style:none;position:relative;margin-top:8px}
.path li{position:relative;padding:0 0 14px 38px}
.path li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.path li:last-child::before{display:none}
.path li.done::before{background:var(--accent)}
.path .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-content:center;font-family:var(--mono);font-size:12px}
.path li.done .dot{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.path li.current .dot{border-color:var(--accent);color:var(--accent-ink)}
.path button{text-align:left;font-weight:500;font-size:14px;padding:4px 0}
.path small{display:block;color:var(--muted);font-size:12px}

/* review */
.slider{margin-top:14px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .top b{font-family:var(--display);font-weight:600}
.slider .top .mono{font-size:18px;color:var(--accent-ink)}
.slider small{color:var(--muted);font-size:12px;display:block}
input[type=range]{width:100%;margin-top:8px;accent-color:var(--accent-ink);height:28px}
.letgo li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.letgo li span{flex:1}
.letgo{list-style:none}
.add-row{display:flex;gap:8px;margin-top:8px}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tile .n{font-family:var(--mono);font-size:24px;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.heat{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:10px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--panel-2)}
.heat .c.future{background:transparent;border:1px dashed var(--line)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-wrap .legend{flex-direction:column;gap:6px}

/* coach */
.session{display:flex;gap:14px;align-items:center}
.cal{width:62px;flex:none;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:center;background:#fff}
.cal .m{background:var(--accent-ink);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;padding:3px 0;text-transform:uppercase}
.cal .d{font-family:var(--mono);font-size:24px;padding:4px 0}
.note{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.note:last-child{border-bottom:0}
.note p{flex:1;font-size:14px;overflow-wrap:anywhere}
.note .tag{color:var(--accent-ink);font-weight:600}
.note .when{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .t{font-size:14px;font-weight:500}
.toggle-row .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;background:#D8D1C3;border-radius:999px;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + span{background:var(--accent-ink)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.sub-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sub-row:last-of-type{border-bottom:0}
.status-active{color:var(--green-ink);font-weight:600}

.toast{position:absolute;left:12px;right:12px;bottom:84px;background:#2B2722;color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;line-height:1.4;opacity:0;transform:translateY(12px);transition:all .25s ease;pointer-events:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:none}
.toast.celebrate{background:linear-gradient(135deg,var(--accent-ink),var(--accent));}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:19}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:0}}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<nav class="demo-nav" aria-label="Demo pages">
  <span class="demo-brand">Courage Plan <em>demo</em></span>
  <div class="demo-links">
    <a href="form.html" id="navForm">Form</a>
    <a href="app.html" aria-current="page">Client app</a>
    <a href="coach.html">Dagmar's dashboard</a>
  </div>
</nav>

<div class="stage">
  <div class="phone" id="phone">
    <header class="app-head">
      <div style="min-width:0">
        <div class="app-sub" id="appSub">Courage Space</div>
        <div class="app-title" id="appTitle">Plan Andrea</div>
      </div>
      <div class="head-btns">
        <a class="pill-btn" id="editApp" href="form.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Edit my app
        </a>
      </div>
    </header>
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="tabbar" role="tablist" aria-label="App sections" id="tabbar">
      <button class="tab" role="tab" data-tab="today" aria-selected="true" aria-controls="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
      <button class="tab" role="tab" data-tab="goals" aria-selected="false" aria-controls="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</button>
      <button class="tab" role="tab" data-tab="review" aria-selected="false" aria-controls="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Review</button>
      <button class="tab" role="tab" data-tab="progress" aria-selected="false" aria-controls="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progress</button>
      <button class="tab" role="tab" data-tab="coach" aria-selected="false" aria-controls="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Coach</button>
    </nav>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
// Validate with Dagmar
const METHOD = {
  coach: 'Dagmar',
  model: 'FALL Through Change',
  phases: [
    { id:'face', n:1, name:'Face the change', summary:'Name what is changing and what feels scary.', prompt:'What is changing, and what are you avoiding looking at?',
      statement:'Something big is changing and I have not fully faced it yet.' },
    { id:'accept', n:2, name:'Accept', summary:'Acknowledge reality without judging it.', prompt:'What is true right now that you can stop fighting?',
      statement:'I can see the change clearly, but part of me is still fighting it.' },
    { id:'letgo', n:3, name:'Let go', summary:'Release habits, beliefs or commitments that no longer serve you.', prompt:'What are you ready to put down this week?',
      statement:'I know what I need to release, and I am working on letting it go.' },
    { id:'learn', n:4, name:'Learn and grow', summary:'Goals, habits and measured progress.', prompt:'What did you learn this week that you will use next week?',
      statement:'I have accepted the change and I am ready to build what comes next.' }
  ],
  values: [
    { id:'courage', name:'Courage', desc:'Leading with vulnerability', color:'#D9822B' },

/* helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const money = n => '$' + Number(n).toLocaleString('en-CA');
const uid = () => Math.random().toString(36).slice(2, 9);
const round1 = n => Math.round(n * 10) / 10;
function encodeCfg(c){ return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(c))))); }
function decodeCfg(s){ try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(s))))); } catch(e){ try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch(e2){ return null; } } }
function store(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch(e){ return false; } }
function load(key){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function drop(key){ try { localStorage.removeItem(key); } catch(e){} }
function firstName(n){ return (String(n || '').trim().split(/\s+/)[0]) || 'there'; }
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function isoDay(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d = today0(); d.setDate(d.getDate() + n); return isoDay(d); }
function parseDay(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysUntil(s){ return Math.round((parseDay(s) - today0()) / 86400000); }
function plural(n, w){ return n + ' ' + w + (Math.abs(n) === 1 ? '' : 's'); }
function dueInfo(s){
  const n = daysUntil(s);
  if (n < 0) return { text:'overdue by ' + plural(-n, 'day'), cls:'late' };
  if (n === 0) return { text:'due today', cls:'soon' };
  return { text:'due in ' + plural(n, 'day'), cls: n <= 7 ? 'soon' : '' };
}
function fmtDate(s, opts){ return parseDay(s).toLocaleDateString('en-CA', opts || { weekday:'short', month:'short', day:'numeric' }); }
function fmtTime(t){ if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; return (((h + 11) % 12) + 1) + ':' + String(m).padStart(2,'0') + ' ' + ap; }
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function areaColor(a){ if (AREA_COLORS[a]) return AREA_COLORS[a]; return EXTRA_COLORS[hashStr(a) % EXTRA_COLORS.length]; }
function phaseById(id){ return METHOD.phases.find(p => p.id === id) || METHOD.phases[3]; }
function applyPalette(id){
  const p = PALETTES[id] || PALETTES.ember, r = document.documentElement.style;
  r.setProperty('--accent', p.accent); r.setProperty('--accent-2', p.accent2); r.setProperty('--accent-soft', p.soft); r.setProperty('--accent-ink', p.ink);
}
function loadEmoji(pct){ return pct <= 80 ? '🟢' : pct <= 100 ? '🟡' : '🔴'; }
function loadLabel(pct){ return pct <= 80 ? 'Sustainable' : pct <= 100 ? 'Near capacity' : 'Over capacity'; }
function tagsOf(text){ return Array.from(new Set((text.match(/#[\w-]+/g) || []).map(t => t.slice(1).toLowerCase()))); }

function makeTasks(rows){ return rows.map(r => ({ id:uid(), title:r[0], hours:r[1], done:r[2], week:r[3] })); }
function makeObjective(o, i){
  const tpl = ANDREA_OBJ[String(o.title).trim().toLowerCase()];
  if (tpl) return { id:uid(), title:o.title, area:o.area, due:addDays(tpl.dueDays), load:tpl.load, coCreated:true, tasks:makeTasks(tpl.tasks) };

function objProgress(o){
  const tot = o.tasks.reduce((s, t) => s + (+t.hours || 0), 0);
  if (!tot) return 0;
  return Math.round(o.tasks.filter(t => t.done).reduce((s, t) => s + (+t.hours || 0), 0) / tot * 100);
}
function overall(){ return S.objectives.length ? Math.round(S.objectives.reduce((s, o) => s + objProgress(o), 0) / S.objectives.length) : 0; }

function mergeCfg(prev, cfg){
  if (!prev || String(prev.cfg.name).trim().toLowerCase() !== String(cfg.name).trim().toLowerCase()) return generateState(cfg);
  const st = prev;
  st.cfg = clone(cfg);
  st.objectives = cfg.objectives.map((o, i) => {
    const hit = prev.objectives.find(p => p.title.trim().toLowerCase() === o.title.trim().toLowerCase());
    if (hit){ hit.area = o.area; return hit; }
    return makeObjective(o, i);
  });
  return st;
}

function currentCfg(){
  const c = clone(S.cfg);
  c.objectives = S.objectives.map(o => ({ title:o.title, area:o.area }));
  return c;
}

function save(){
  store(KEY, S);
  if (S.fromForm) store('cp_demo_client', { cfg:currentCfg(), source:'app', updatedAt:new Date().toISOString(), snapshot:snapshot() });
  const href = 'form.html?cfg=' + encodeCfg(currentCfg());
  $('#editApp').href = href; $('#navForm').href = href;
}
function snapshot(){
  const hist = S.progressHist.concat([overall()]);
  return {
    progress: overall(),
    objectives: S.objectives.map(o => ({ title:o.title, area:o.area, progress:objProgress(o), due:o.due })),
    history: hist,
    values: S.valuesHist,
    lastReview: S.lastReview,
    streak: S.streak,
    notes: S.notes.slice(0, 5).map(n => ({ text:n.text, date:n.date })),
    reviewText: S.reviewText,
    nextSession: S.nextSession
  };
}

function boot(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('cfg');
  let prev = load(KEY);
  if (prev && (!prev.cfg || !Array.isArray(prev.objectives))) prev = null;
  if (raw){
    const cfg = decodeCfg(raw);
    if (cfg && cfg.name){
      if (!Array.isArray(cfg.objectives)) cfg.objectives = [];
      if (!Array.isArray(cfg.areas)) cfg.areas = [];
      cfg.privacy = Object.assign({ progress:true, values:true, review:false }, cfg.privacy || {});
      if (prev && prev.appliedCfg === raw){ S = prev; }
      else { S = mergeCfg(prev, cfg); S.appliedCfg = raw; S.fromForm = true; }
      try { history.replaceState(null, '', location.pathname); } catch(e){}
    } else {
      S = prev || generateState(clone(EXAMPLE));
    }
  } else {
    S = prev || generateState(clone(EXAMPLE));
  }
  if (!S.todayDone || S.todayDone.day !== isoDay(today0())) S.todayDone = { day:isoDay(today0()), ids:[] };
  applyPalette(S.cfg.palette);
  save();
  render();
}

/* derived */
function areasList(){
  const a = (S.cfg.areas || []).slice();
  const extra = (METHOD.programs[S.cfg.program] || {}).extraArea;
  if (extra && !a.includes(extra)) a.push(extra);
  S.objectives.forEach(o => { if (o.area && !a.includes(o.area)) a.push(o.area); });
  return a;
}
function weekTasks(){ const r = []; S.objectives.forEach(o => o.tasks.forEach(t => { if (t.week) r.push({ t, o }); })); return r; }
function weekStats(){
  const w = weekTasks(); const done = w.filter(x => x.t.done);
  return { total:w.length, done:done.length, hours:round1(done.reduce((s, x) => s + (+x.t.hours || 0), 0)), pct: w.length ? Math.round(done.length / w.length * 100) : 0 };

function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function priorities(){
  const ids = S.todayDone.ids;
  let c = weekTasks().filter(x => !x.t.done || ids.includes(x.t.id));
  const order = S.objectives.map(o => o.id);
  const byDue = (a, b) => daysUntil(a.o.due) - daysUntil(b.o.due) || order.indexOf(a.o.id) - order.indexOf(b.o.id);
  if (S.energy === 'high') c.sort((a, b) => b.t.hours - a.t.hours || byDue(a, b));
  else if (S.energy === 'low') c.sort((a, b) => a.t.hours - b.t.hours || byDue(a, b));
  else c.sort(byDue);
  return c.slice(0, 3);
}

function ring(pct, size, w){

      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s"/>

}

function lineChart(data){
  const W = 340, H = 160, pl = 28, pr = 8, pt = 10, pb = 22;
  const x = i => pl + i * (W - pl - pr) / (data.length - 1), y = v => pt + (100 - v) * (H - pt - pb) / 100;
  const pts = data.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  const area = `M${x(0)},${y(0)} L${pts.join(' L')} L${x(data.length - 1)},${H - pb} L${x(0)},${H - pb} Z`;
  const grid = [0, 25, 50, 75, 100].map(g => `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-dasharray="${g ? '3 3' : ''}"/><text x="${pl - 6}" y="${y(g) + 3}" text-anchor="end">${g}</text>`).join('');
  const labels = data.map((_, i) => (i % 3 === 0 || i === data.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${i === data.length - 1 ? 'Now' : 'W' + (i + 1)}</text>` : '').join('');
  const last = data.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Objective progress over 12 weeks, from ${data[0]} to ${data[last]} percent">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#lg)"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last)}" cy="${y(data[last])}" r="4.5" fill="#fff" stroke="var(--accent-ink)" stroke-width="2.5"/>
    <text x="${x(last) - 8}" y="${y(data[last]) - 9}" text-anchor="end" style="fill:var(--text);font-size:11px">${data[last]}%</text>${labels}</svg>`;
}
function valuesChart(){
  const W = 340, H = 150, pl = 22, pr = 8, pt = 8, pb = 20, n = 8;
  const x = i => pl + i * (W - pl - pr) / (n - 1), y = v => pt + (10 - v) * (H - pt - pb) / 9;
  const grid = [1, 4, 7, 10].map(g => `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${pl - 6}" y="${y(g) + 3}" text-anchor="end">${g}</text>`).join('');
  const lines = METHOD.values.map(v => { const d = S.valuesHist[v.id].slice(-n); return `<polyline points="${d.map((s, i) => x(i) + ',' + y(s)).join(' ')}" fill="none" stroke="${v.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` + d.map((s, i) => i === d.length - 1 ? `<circle cx="${x(i)}" cy="${y(s)}" r="3.5" fill="${v.color}"/>` : '').join(''); }).join('');
  const labels = Array.from({ length:n }, (_, i) => (i % 2 === 1 || i === n - 1) ? `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${i === n - 1 ? 'Now' : 'W' + (i + 1)}</text>` : '').join('');
  const summary = METHOD.values.map(v => v.name + ' ' + S.valuesHist[v.id][S.valuesHist[v.id].length - 1]).join(', ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Value scores over 8 weeks. This week: ${summary}">${grid}${lines}${labels}</svg>`;
}
function heatColor(l){ return ['var(--panel-2)', 'color-mix(in srgb, var(--accent) 25%, #fff)', 'color-mix(in srgb, var(--accent) 50%, #fff)', 'color-mix(in srgb, var(--accent) 78%, #fff)', 'var(--accent-ink)'][l]; }
function heatmap(){
  const r = rng(hashStr(S.cfg.name || 'x'));
  const now = new Date(); const dow = (now.getDay() + 6) % 7; // Monday = 0
  let cols = '', active = 0;
  for (let w = 0; w < 16; w++){
    let cells = '';
    for (let d = 0; d < 7; d++){
      const future = w === 15 && d > dow;
      if (future){ cells += '<span class="c future"></span>'; continue; }
      const ramp = 0.35 + 0.55 * (w / 15);
      let lvl = r() < ramp ? 1 + Math.floor(r() * 4) : 0;
      if (d >= 5 && lvl > 2) lvl -= 1;
      if (lvl) active++;
      cells += `<span class="c" style="background:${heatColor(lvl)}"></span>`;
    }
    cols += `<div class="col">${cells}</div>`;
  }
  return `<div class="heat" role="img" aria-label="Consistency heatmap: active on ${active} days in the last 16 weeks">${cols}</div>`;
}
function donut(){
  const by = {};
  S.objectives.forEach(o => o.tasks.forEach(t => { if (t.done) by[o.area] = (by[o.area] || 0) + (+t.hours || 0); }));
  const entries = Object.entries(by).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const tot = entries.reduce((s, e) => s + e[1], 0);
  if (!tot) return '<p class="empty">Complete a task to see your hours by area.</p>';
  const R = 52, w = 18, c = 2 * Math.PI * R; let acc = 0;
  const arcs = entries.map(([a, h]) => { const len = h / tot * c; const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${areaColor(a)}" stroke-width="${w}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`; acc += len; return s; }).join('');
  return `<div class="donut-wrap" style="margin-top:10px">
    <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Hours by area: ${entries.map(e => e[0] + ' ' + round1(e[1]) + ' hours').join(', ')}">${arcs}
      <text x="70" y="68" text-anchor="middle" style="font-family:var(--mono);font-size:20px;fill:var(--text)">${round1(tot)}</text><text x="70" y="86" text-anchor="middle" style="font-size:11px;fill:var(--muted)">hours</text></svg>
    <div class="legend">${entries.map(([a, h]) => `<span><i style="background:${areaColor(a)}"></i>${esc(a)} <b class="mono" style="font-weight:500">${round1(h)} h</b></span>`).join('')}</div>
  </div>`;
}

    </div>

  </section>

  <section class="card" aria-labelledby="dmh">
    <h3 id="dmh">Demo controls</h3>
    <div class="small">Changes are saved in this browser. Reset to start again from Andrea's example.</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <a class="btn btn-soft" href="${'form.html?cfg=' + encodeCfg(currentCfg())}">Edit my app</a>
      <button class="btn btn-danger" data-act="reset">Reset demo</button>
    </div>
  </section>`;
}

/* icons */
const ICON = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  lock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
};

/* toast + confetti */
let toastT;
function toast(msg, celebrate){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (celebrate ? ' celebrate' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', celebrate ? 4800 : 2800);
  if (celebrate) confetti();
}
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('#confetti'); const cols = [getComputedStyle(document.documentElement).getPropertyValue('--accent'), '#F2A25C', '#5FAE6C', '#E0625F', '#8A6FD1'];
  box.innerHTML = Array.from({ length:40 }, () => `<i style="left:${Math.random() * 100}%;background:${cols[Math.floor(Math.random() * cols.length)]};animation-delay:${Math.random() * .4}s;animation-duration:${1.2 + Math.random()}s"></i>`).join('');
  setTimeout(() => box.innerHTML = '', 2600);
}

/* actions */
function findObj(id){ return S.objectives.find(o => o.id === id); }
function toggleTask(objId, taskId, checked){
  const o = findObj(objId); if (!o) return; const t = o.tasks.find(x => x.id === taskId); if (!t) return;
  const wasComplete = objProgress(o) === 100;
  t.done = checked;
  const ids = S.todayDone.ids;
  if (checked && !ids.includes(t.id)) ids.push(t.id);
  if (objProgress(o) === 100 && !wasComplete && checked){
    const total = S.objectives.length, n = S.objectives.filter(x => objProgress(x) === 100).length;
    toast('🎉 You completed ' + o.title + '. It moves you toward your vision: ' + n + ' of ' + total + ' (' + Math.round(n / total * 100) + '%)', true);
  } else if (checked){
    toast('Nice. ' + t.title + ' is done.');
  }
  save(); render();
  const again = document.getElementById(document.activeElement && document.activeElement.id ? document.activeElement.id : '');
  if (again) again.focus();
}
function act(name, el){
  const d = el.dataset;
  switch(name){
    case 'energy': S.energy = d.v; save(); render(); toast({ high:'🔥 High energy: bigger tasks first.', normal:'🙂 Normal energy: ordered by deadline.', low:'😴 Low energy: shorter tasks first.' }[d.v]); break;
    case 'editVision': ui.editVision = true; render(); setTimeout(() => { const v = $('#visionIn'); if (v) v.focus(); }); break;
    case 'cancelVision': ui.editVision = false; render(); break;
    case 'saveVision': { const v = $('#visionIn').value.trim(); if (!v) return; S.cfg.vision = v; ui.editVision = false; save(); render(); toast('Vision saved.'); break; }
    case 'addObj': ui.addObj = true; ui.editObj = null; render(); setTimeout(() => { const t = $('#of_t'); if (t) t.focus(); }); break;
    case 'editObj': ui.editObj = d.obj; ui.addObj = false; render(); setTimeout(() => { const t = $('#of_t'); if (t) t.focus(); }); break;
    case 'cancel': ui.editObj = null; ui.addObj = false; ui.addTask = null; ui.editTask = null; render(); break;
    case 'saveObj': {
      const title = $('#of_t').value.trim(), area = $('#of_a').value, load = Math.max(0.5, +$('#of_l').value || 1), due = $('#of_d').value || addDays(60);
      if (!title){ $('#ofErr').textContent = 'Please name the objective.'; $('#of_t').focus(); return; }
      if (d.obj){ const o = findObj(d.obj); Object.assign(o, { title, area, load, due }); toast('Objective updated.'); }
      else { S.objectives.push({ id:uid(), title, area, load, due, coCreated:true, tasks:[] }); ui.addTask = S.objectives[S.objectives.length - 1].id; toast('Objective added. Now add its first task.'); }
      ui.editObj = null; ui.addObj = false; save(); render();
      if (ui.addTask) setTimeout(() => { const t = $('#nt_t'); if (t) t.focus(); });
      break;
    }
    case 'delObj': { const o = findObj(d.obj); if (!o) return; if (!confirm('Delete "' + o.title + '" and its tasks?')) return; S.objectives = S.objectives.filter(x => x.id !== d.obj); save(); render(); toast('Objective deleted.'); break; }
    case 'addTask': ui.addTask = d.obj; ui.editTask = null; render(); setTimeout(() => { const t = $('#nt_t'); if (t) t.focus(); }); break;
    case 'saveNewTask': {
      const o = findObj(d.obj), title = $('#nt_t').value.trim(), hours = Math.max(0.25, +$('#nt_h').value || 1);
      if (!title){ $('#nt_t').focus(); return; }
      o.tasks.push({ id:uid(), title, hours, done:false, week:true }); ui.addTask = null; save(); render(); toast('Task added to this week.'); break;
    }
    case 'editTask': ui.editTask = d.task; ui.addTask = null; render(); setTimeout(() => { const t = $('#et_t'); if (t) t.focus(); }); break;
    case 'saveTask': { const o = findObj(d.obj), t = o && o.tasks.find(x => x.id === d.task); if (!t) return; const title = $('#et_t').value.trim(); if (!title) return; t.title = title; t.hours = Math.max(0.25, +$('#et_h').value || t.hours); ui.editTask = null; save(); render(); toast('Task updated.'); break; }
    case 'delTask': { const o = findObj(d.obj); if (!o) return; const t = o.tasks.find(x => x.id === d.task); if (!t || !confirm('Delete "' + t.title + '"?')) return; o.tasks = o.tasks.filter(x => x.id !== d.task); save(); render(); toast('Task deleted.'); break; }
    case 'earlier': ui.earlier[d.obj] = !ui.earlier[d.obj]; render(); break;
    case 'impact': { const i = +d.i; S.impactDone[i] = !S.impactDone[i]; save(); render(); if (S.impactDone[i]) toast('🎉 ' + METHOD.programs.impact.steps[i] + ' is done. ' + S.impactDone.filter(Boolean).length + ' of 6 steps.', true); break; }
    case 'addLetgo': { const inp = document.getElementById(d.for || el.id); const v = inp && inp.value.trim(); if (!v) return; S.letgo.push(v); save(); render(); toast('Added to your Letting go of list.'); setTimeout(() => { const n = document.getElementById(inp.id); if (n) n.focus(); }); break; }
    case 'rmLetgo': S.letgo.splice(+d.i, 1); save(); render(); toast('Let go. Well done.'); break;
    case 'submitReview': {
      const dr = S.draft, todayIso = isoDay(today0()), again = S.reviewedOn === todayIso;
      METHOD.values.forEach(v => { const h = S.valuesHist[v.id]; if (again) h[h.length - 1] = dr.values[v.id]; else { h.push(dr.values[v.id]); if (h.length > 8) h.shift(); } });
      if (dr.wins || dr.obstacles || dr.focus) S.reviewText = { wins:dr.wins, obstacles:dr.obstacles, focus:dr.focus };
      if (!again){ S.streak += 1; S.progressHist.push(overall()); if (S.progressHist.length > 11) S.progressHist.shift(); }
      S.lastReview = todayIso; S.reviewedOn = todayIso; S.draft = null;
      save(); render(); $('#screen').scrollTop = 0;
      toast(again ? 'Review updated.' : '🎉 Weekly review done. Your streak is now ' + S.streak + ' weeks.', !again);
      break;
    }
    case 'filter': ui.noteFilter = d.v || null; render(); break;
    case 'addNote': { const inp = $('#noteIn'); const v = inp.value.trim(); if (!v) return; S.notes.unshift({ id:uid(), text:v, date:isoDay(today0()) }); ui.noteFilter = null; save(); render(); toast('Note saved for your session.'); setTimeout(() => { const n = $('#noteIn'); if (n) n.focus(); }); break; }
    case 'delNote': S.notes = S.notes.filter(n => n.id !== d.id); save(); render(); break;
    case 'pay': toast('Demo only. Payments are handled securely in the real service.'); break;
    case 'reset':
      if (!confirm('Reset the demo to Andrea\'s original example? Your changes in this browser will be cleared.')) return;
      drop(KEY); drop('cp_demo_client');
      S = generateState(clone(EXAMPLE)); Object.assign(ui, { tab:'today', editObj:null, addObj:false, addTask:null, editTask:null, earlier:{}, noteFilter:null, editVision:false });
      applyPalette(S.cfg.palette); save(); render(); $('#screen').scrollTop = 0; toast('Demo reset to Andrea\'s example.');
      break;
  }
}

/* events */
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) switchTab(b.dataset.tab); });
$('#tabbar').addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const tabs = Array.from(document.querySelectorAll('.tab')); const i = tabs.findIndex(t => t.dataset.tab === ui.tab);
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; switchTab(n.dataset.tab); n.focus();
});
const scr = $('#screen');
scr.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.dataset.act === 'toggle') return;
  e.preventDefault(); act(el.dataset.act, el);
});
scr.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'toggle'){ const id = t.id; toggleTask(t.dataset.obj, t.dataset.task, t.checked); const n = document.getElementById(id); if (n) n.focus(); return; }
  if (t.dataset.priv){ S.cfg.privacy[t.dataset.priv] = t.checked; save(); toast(t.checked ? 'Dagmar can now see this.' : 'Hidden from Dagmar.'); return; }
  if (t.dataset.bind === 'capacity'){ S.capacity = Math.max(1, +t.value || 10); save(); render(); return; }
});
let refT;
scr.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.val){ S.draft.values[t.dataset.val] = +t.value; document.getElementById('rvo_' + t.dataset.val).textContent = t.value; store(KEY, S); return; }
  if (t.dataset.draft){ S.draft[t.dataset.draft] = t.value; store(KEY, S); return; }
  if (t.dataset.bind === 'reflection'){ S.reflection[S.cfg.phase] = t.value; store(KEY, S); clearTimeout(refT); const s = $('#refSaved'); if (s){ s.textContent = 'Saving...'; refT = setTimeout(() => { s.textContent = 'Saved on this device'; }, 500); } }
});
scr.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset.enter){ e.preventDefault(); act(t.dataset.enter, t); }
  if (e.key === 'Escape' && (ui.editObj || ui.addObj || ui.addTask || ui.editTask)){ act('cancel', t); }
});

boot();
</script>
